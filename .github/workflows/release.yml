name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.os }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true
      - name: Verify all platforms and publish together
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          test -f "release/yu-daguan-offline-${GITHUB_REF_NAME}-windows-x64-portable.zip"
          test -f "release/yu-daguan-offline-${GITHUB_REF_NAME}-macos-arm64.zip"
          test -f "release/yu-daguan-offline-${GITHUB_REF_NAME}-macos-x64.zip"
          (cd release && sha256sum *.zip > SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt --title "宇的大观本地版 $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
          fi
